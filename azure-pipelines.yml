trigger:
  batch: true
  branches:
    include:
    - master
    - dev

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'release'
  projects: 'src/**/*.csproj'

steps:
- task: NuGetToolInstaller@1
  displayName: 'Use Nuget'
  inputs:
    versionSpec: 
    checkLatest: true
- task: UseDotNet@2
  displayName: Use Dotnet
  inputs:
    packageType: sdk
    version: 9.x
- task: NuGetCommand@2
  displayName: 'restoring'
  inputs:
    command: 'restore'
    restoreSolution: '**/*.sln'
    feedsToUse: 'select'
# Fails the build when a shipped package depends on a package with a known vulnerability, including
# transitive dependencies of the netstandard and net462 builds (ANALYSIS-04 §3.1).
- pwsh: |
    $vulnerable = $false
    Get-ChildItem src -Recurse -Filter *.csproj | Where-Object { $_.FullName -notmatch '[\\/](tests|bin|obj)[\\/]' } | ForEach-Object {
      $output = dotnet list $_.FullName package --vulnerable --include-transitive 2>&1 | Out-String
      if ($output -match 'has the following vulnerable packages') { Write-Host $output; $vulnerable = $true }
    }
    if ($vulnerable) { Write-Host '##vso[task.logissue type=error]Vulnerable packages found.'; exit 1 }
  displayName: 'checking for vulnerable packages'
- task: DotNetCoreCLI@2
  displayName: 'building'
  inputs:
    command: 'build'
    projects: $(projects)
    arguments: '-c $(buildConfiguration)'
- task: DotNetCoreCLI@2
  displayName: 'testing'
  inputs:
    command: 'test'
    projects: '**/*.Tests.csproj'
    # A test project that runs no tests fails the build, so tests cannot silently stop running again (T-1).
    arguments: '-- RunConfiguration.TreatNoTestsAsError=true'
- task: DotNetCoreCLI@2
  displayName: 'packing'
  condition: eq(variables['build.sourceBranch'], 'refs/heads/dev')
  inputs:
    command: 'custom'
    projects: $(projects)
    custom: 'pack'
    arguments: '-c $(buildConfiguration) --no-build -o $(Build.ArtifactStagingDirectory) --version-suffix dev$(Build.BuildNumber)'
- task: DotNetCoreCLI@2
  displayName: 'packing'
  condition: eq(variables['build.sourceBranch'], 'refs/heads/master')
  inputs:
    command: 'custom'
    projects: $(projects)
    custom: 'pack'
    arguments: '-c $(buildConfiguration) --no-build -o $(Build.ArtifactStagingDirectory)'
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'packages'
    publishLocation: 'Container'
